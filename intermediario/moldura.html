<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>MonitorIA – Template Base</title>
<meta name="viewport" content="width=1672, initial-scale=1">
<style>
:root{
  --petrol:#0D3B4C; --petrol-2:#0A2F3D; --orange:#FF7A00; --white:#FFFFFF; --gray:#F5F7FA;
  --line:#E6EBF0; --text:#0D3B4C; --muted:#6B8290;
  --side-w:288px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Inter","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;background:var(--gray);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;border:0;background:none;cursor:pointer;color:inherit}
a{text-decoration:none;color:inherit}
.app{display:flex;width:100vw;height:100vh;min-width:1100px;min-height:640px}

/* ---------- Sidebar ---------- */
.sidebar{width:var(--side-w);flex:0 0 var(--side-w);background:linear-gradient(180deg,var(--petrol) 0%,var(--petrol-2) 100%);color:#fff;display:flex;flex-direction:column;padding:28px 20px 0;position:relative;overflow:hidden;transition:width .28s ease,flex-basis .28s ease,padding .28s ease}
.brand{display:flex;align-items:center;gap:12px;padding:0 6px;white-space:nowrap}
.brand svg{flex:0 0 44px}
.wordmark{font-size:26px;font-weight:700;letter-spacing:-.5px;line-height:1}
.wordmark b{color:var(--orange);font-weight:800}
.tagline{font-size:11.5px;line-height:1.55;color:rgba(255,255,255,.66);margin:16px 6px 0;padding-bottom:22px;border-bottom:1px solid rgba(255,255,255,.12)}
.nav{margin-top:22px;display:flex;flex-direction:column;gap:8px;position:relative;z-index:2}
.nav-item{display:flex;align-items:center;gap:14px;width:100%;height:50px;padding:0 16px;border-radius:14px;color:#fff;font-size:15px;font-weight:500;text-align:left;white-space:nowrap;transition:background .18s ease,transform .18s ease}
.nav-item svg{flex:0 0 22px}
.nav-item:hover{background:rgba(255,255,255,.09)}
.nav-item:focus-visible,.icon-btn:focus-visible,.menu-btn:focus-visible,.profile:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.nav-item.active{background:var(--orange);box-shadow:0 8px 20px -8px rgba(255,122,0,.75);font-weight:600}
.side-deco{position:absolute;left:0;right:0;bottom:0;height:210px;pointer-events:none;z-index:1}
.side-deco svg{width:288px;height:210px;display:block}

.app.collapsed{--side-w:88px}
.app.collapsed .sidebar{padding-left:16px;padding-right:16px}
.app.collapsed .brand{justify-content:center;padding:0}
.app.collapsed .brand .wordmark,.app.collapsed .nav-item span{display:none}
.app.collapsed .tagline{height:0;overflow:hidden;margin-top:22px;padding:0}
.app.collapsed .nav-item{justify-content:center;padding:0}

/* ---------- Header ---------- */
.right{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:80px;flex:0 0 80px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 32px 0 24px;box-shadow:0 1px 0 var(--line),0 6px 18px -14px rgba(13,59,76,.35);position:relative;z-index:20}
.top-left{display:flex;align-items:center;gap:18px}
.menu-btn{width:44px;height:44px;border-radius:50%;background:var(--gray);display:grid;place-items:center;color:var(--petrol);transition:background .18s,transform .18s}
.menu-btn:hover{background:#E9EEF3}
.menu-btn:active{transform:scale(.94)}
.top-left .brand{padding:0;gap:10px}
.top-left .wordmark{font-size:22px;color:var(--petrol)}
.top-right{display:flex;align-items:center;gap:10px}
.pop-wrap{position:relative}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--petrol);position:relative;transition:background .18s}
.icon-btn:hover,.icon-btn[aria-expanded="true"]{background:var(--gray)}
.badge{position:absolute;top:8px;right:8px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--orange);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;border:2px solid #fff;box-sizing:content-box}
.badge[hidden]{display:none}
.divider{width:1px;height:36px;background:var(--line);margin:0 10px}
.profile{display:flex;align-items:center;gap:12px;padding:6px 10px 6px 6px;border-radius:28px;transition:background .18s;text-align:left}
.profile:hover,.profile[aria-expanded="true"]{background:var(--gray)}
.avatar{width:46px;height:46px;border-radius:50%;overflow:hidden;flex:0 0 46px;box-shadow:0 0 0 2px #fff,0 0 0 4px rgba(255,122,0,.55)}
.avatar svg{display:block}
.p-name{font-size:14.5px;font-weight:700;color:var(--petrol);line-height:1.2}
.p-role{font-size:12px;color:var(--muted);margin-top:2px}
.chev{color:var(--muted);transition:transform .2s}
.profile[aria-expanded="true"] .chev{transform:rotate(180deg)}

/* ---------- Popovers ---------- */
.pop{position:absolute;top:56px;right:0;width:320px;background:#fff;border-radius:18px;box-shadow:0 20px 50px -12px rgba(13,59,76,.28),0 0 0 1px var(--line);padding:8px;opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .16s,transform .16s;z-index:30}
.pop.open{opacity:1;transform:none;pointer-events:auto}
.pop-head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 8px;font-size:14px;font-weight:700}
.pop-head button{font-size:12px;font-weight:600;color:var(--orange)}
.pop-head button:hover{text-decoration:underline}
.pop-row{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:12px;width:100%;text-align:left;font-size:13px;line-height:1.4;color:var(--petrol)}
.pop-row:hover{background:var(--gray)}
.pop-row small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.dot{flex:0 0 8px;width:8px;height:8px;border-radius:50%;background:var(--orange);margin-top:5px}
.pop-row.read .dot{background:#D5DDE3}
.ini{flex:0 0 34px;height:34px;border-radius:50%;background:#E3EEF2;color:var(--petrol);font-size:12px;font-weight:700;display:grid;place-items:center}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:12px;font-size:13.5px;border-radius:12px}
.switch{width:42px;height:24px;border-radius:12px;background:#D5DDE3;position:relative;transition:background .18s;flex:0 0 42px}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s}
.switch[aria-checked="true"]{background:var(--orange)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}
.pop.small{width:220px}
.pop.small .pop-row{align-items:center;font-size:13.5px;font-weight:500}
.pop hr{border:0;border-top:1px solid var(--line);margin:6px 8px}

/* ---------- Main ---------- */
.main{flex:1;padding:28px 32px 32px;min-height:0;display:flex}
.canvas{flex:1;background:#fff;border-radius:32px;box-shadow:0 18px 48px -24px rgba(13,59,76,.28),0 2px 6px rgba(13,59,76,.04);position:relative;overflow:hidden}
.canvas .deco{position:absolute;inset:0;transition:opacity .3s;background-image:radial-gradient(rgba(13,59,76,.07) 1.2px,transparent 1.4px);background-size:28px 28px;-webkit-mask-image:radial-gradient(ellipse at center,transparent 30%,#000 100%);mask-image:radial-gradient(ellipse at center,transparent 30%,#000 100%)}
.canvas svg.net{position:absolute;inset:0;width:100%;height:100%;transition:opacity .3s}
.canvas.plain .deco,.canvas.plain svg.net{opacity:0}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--petrol);color:#fff;font-size:13px;padding:11px 18px;border-radius:12px;box-shadow:0 12px 30px -10px rgba(13,59,76,.6);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>

    <!-- ÁREA CENTRAL DINÂMICA (vazia) -->
    <main class="main">
      <section class="canvas" id="canvas" aria-label="Área de conteúdo do módulo">
        <div class="deco" aria-hidden="true"></div>
        <svg class="net" viewBox="0 0 1320 800" preserveAspectRatio="xMidYMid slice" fill="none" aria-hidden="true">
          <g stroke="#0D3B4C" stroke-width="1" opacity=".07">
            <path d="M1320 90 L1210 130 L1130 70 L1040 150 L1150 230 L1210 130"/>
            <path d="M1150 230 L1250 300 L1320 260M1040 150 L960 90 L900 0M1130 70 L1160 0"/>
            <path d="M0 700 L90 650 L170 720 L260 640 L150 570 L90 650"/>
            <path d="M260 640 L360 700 L420 800M170 720 L190 800M150 570 L60 520 L0 540"/>
            <path d="M1320 720 L1240 680 L1180 740 L1100 800"/>
          </g>
          <g fill="#0D3B4C" opacity=".12">
            <circle cx="1210" cy="130" r="4"/><circle cx="1130" cy="70" r="3"/><circle cx="1150" cy="230" r="3"/><circle cx="960" cy="90" r="2.500"/><circle cx="1250" cy="300" r="2.500"/>
            <circle cx="90" cy="650" r="4"/><circle cx="170" cy="720" r="3"/><circle cx="150" cy="570" r="3"/><circle cx="360" cy="700" r="2.500"/><circle cx="60" cy="520" r="2.500"/>
            <circle cx="1240" cy="680" r="3"/><circle cx="1180" cy="740" r="2.500"/>

            <circle cx="1040" cy="150" r="4"/><circle cx="260" cy="640" r="4"/>

        </svg>

  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  var app=document.getElementById('app'), menuBtn=document.getElementById('menuBtn'),
      swCompact=document.getElementById('swCompact'), swDeco=document.getElementById('swDeco'),
      canvas=document.getElementById('canvas'), toast=document.getElementById('toast'), tt;

  function showToast(m){toast.textContent=m;toast.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){toast.classList.remove('show')},2200)}

  function setCollapsed(c){
    app.classList.toggle('collapsed',c);
    menuBtn.setAttribute('aria-expanded',String(!c));
    swCompact.setAttribute('aria-checked',String(c));
  }
  menuBtn.addEventListener('click',function(){setCollapsed(!app.classList.contains('collapsed'))});
  swCompact.addEventListener('click',function(){setCollapsed(!app.classList.contains('collapsed'))});
  swDeco.addEventListener('click',function(){
    var on=swDeco.getAttribute('aria-checked')!=='true';
    swDeco.setAttribute('aria-checked',String(on));
    canvas.classList.toggle('plain',!on);
  });

  // Popovers
  var triggers=[].slice.call(document.querySelectorAll('[data-pop]'));
  function closeAll(except){
    triggers.forEach(function(t){
      if(t===except)return;
      t.setAttribute('aria-expanded','false');
      document.getElementById(t.dataset.pop).classList.remove('open');
    });
  }
  triggers.forEach(function(t){
    t.addEventListener('click',function(e){
      e.stopPropagation();
      var p=document.getElementById(t.dataset.pop), open=!p.classList.contains('open');
      closeAll(t);
      p.classList.toggle('open',open);
      t.setAttribute('aria-expanded',String(open));
    });
  });
  document.querySelectorAll('.pop').forEach(function(p){p.addEventListener('click',function(e){e.stopPropagation()})});
  document.addEventListener('click',function(){closeAll()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeAll()});

  // Notificações
  var nb=document.getElementById('notifBadge');
  function updateNotif(){
    var n=document.querySelectorAll('#popNotif .pop-row:not(.read)').length;
    nb.textContent=n; nb.hidden=n===0;
  }
  document.querySelectorAll('#popNotif .pop-row').forEach(function(r){
    r.addEventListener('click',function(){r.classList.add('read');updateNotif()});
  });
  document.getElementById('markRead').addEventListener('click',function(){
    document.querySelectorAll('#popNotif .pop-row').forEach(function(r){r.classList.add('read')});updateNotif();
  });
  // Mensagens
  var mb=document.getElementById('msgBadge');
  document.querySelectorAll('#popMsg .pop-row').forEach(function(r){
    r.addEventListener('click',function(){
      if(!r.dataset.read){r.dataset.read='1';r.style.opacity='.6';
        var n=document.querySelectorAll('#popMsg .pop-row:not([data-read])').length;mb.textContent=n;mb.hidden=n===0;}
    });
  });
  // Menu do usuário
  document.querySelectorAll('#popUser [data-msg]').forEach(function(b){
    b.addEventListener('click',function(){closeAll();showToast(b.dataset.msg)});
  });
  // Módulos fora do protótipo
  document.querySelectorAll('[data-off]').forEach(function(b){
    b.addEventListener('click',function(){showToast('Módulo "'+b.dataset.off+'" não faz parte deste protótipo')});
  });
  // Item ativo conforme a página atual
  var page=(location.pathname.split('/').pop()||'').toLowerCase();
  document.querySelectorAll('.nav a.nav-item').forEach(function(a){
    if(a.getAttribute('href')===page){a.classList.add('active');a.setAttribute('aria-current','page')}
  });
})();
</script>
</body>
</html>
