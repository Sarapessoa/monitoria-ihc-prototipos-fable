<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MonitorIA</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#f3f5f9;color:#1c2536;
    display:flex;min-width:1200px;min-height:600px;overflow:hidden;
  }

  /* Menu lateral */
  .sidebar{
    width:272px;flex:none;height:100vh;
    background:#12233f;color:#c9d3e6;
    display:flex;flex-direction:column;
  }
  .brand{
    height:76px;display:flex;align-items:center;gap:12px;
    padding:0 24px;border-bottom:1px solid rgba(255,255,255,.08);
  }
  .brand-name{font-size:22px;font-weight:600;color:#fff;letter-spacing:.2px}
  .brand-name b{color:#4fd1c5;font-weight:700}
  nav{padding:20px 14px;flex:1}
  nav ul{list-style:none;display:flex;flex-direction:column;gap:4px}
  .item{
    width:100%;display:flex;align-items:center;gap:14px;
    height:48px;padding:0 14px;border-radius:8px;
    font:inherit;font-size:15.5px;color:#c9d3e6;text-decoration:none;
    background:none;border:0;cursor:pointer;text-align:left;
    transition:background .15s,color .15s;
  }
  .item svg{width:21px;height:21px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .item:hover{background:rgba(255,255,255,.08);color:#fff}
  .item:focus-visible{outline:2px solid #4fd1c5;outline-offset:2px}
  .item:active{background:rgba(255,255,255,.14)}

  .notice{
    margin:0 14px 18px;padding:12px 14px;border-radius:8px;
    background:rgba(79,209,197,.12);border:1px solid rgba(79,209,197,.35);
    color:#d8f5f1;font-size:13.5px;line-height:1.4;
    opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s;
    pointer-events:none;
  }
  .notice.show{opacity:1;transform:none}

  /* Coluna principal */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;height:100vh}
  .topbar{
    height:76px;flex:none;background:#fff;border-bottom:1px solid #e1e6ef;
    display:flex;align-items:center;justify-content:flex-end;padding:0 32px;
  }
  .user{display:flex;align-items:center;gap:12px}
  .avatar{
    width:42px;height:42px;border-radius:50%;
    background:#1f8f86;color:#fff;font-weight:600;font-size:15px;
    display:flex;align-items:center;justify-content:center;
  }
  .user-name{font-size:15px;font-weight:600;color:#1c2536;line-height:1.25}
  .user-role{font-size:13px;color:#5f6b80;line-height:1.25}

  /* Área central vazia: os módulos serão carregados aqui */
  .content{flex:1;min-height:0;overflow:auto;padding:32px}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="brand">
    <svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true">
      <rect width="36" height="36" rx="9" fill="#1f8f86"/>
      <path d="M8 25V12l6 8 4-6 4 6 6-8v13" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="28" cy="9" r="2.4" fill="#b9f3ec"/>
    </svg>
    <span class="brand-name">Monitor<b>IA</b></span>
  </div>

  <nav aria-label="Módulos do sistema">
    <ul>
      <li><a class="item" href="dashboard.html">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="10" rx="1.5"/><rect x="13" y="3" width="8" height="6" rx="1.5"/><rect x="13" y="11" width="8" height="10" rx="1.5"/><rect x="3" y="15" width="8" height="6" rx="1.5"/></svg>
        Dashboard</a></li>
      <li><a class="item" href="alunos.html">
        <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.8a3.5 3.5 0 0 1 0 6.4M18 14.5c2.2.8 3.5 2.7 3.5 5.5"/></svg>
        Alunos</a></li>
      <li><button type="button" class="item" data-modulo="Comunicação">
        <svg viewBox="0 0 24 24"><path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-8l-5 4v-4H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/><path d="M8 10h8M8 13h5"/></svg>
        Comunicação</button></li>
      <li><button type="button" class="item" data-modulo="Inteligência Artificial">
        <svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>
        Inteligência Artificial</button></li>
      <li><a class="item" href="relatorios.html">
        <svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/><path d="M9.5 17v-3M12.5 17v-6M15.5 17v-4"/></svg>
        Relatórios</a></li>
      <li><button type="button" class="item" data-modulo="Ajuda">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.6 2.2c-.7.4-1.1 1-1.1 1.8"/><circle cx="12" cy="17" r=".6" fill="currentColor"/></svg>
        Ajuda</button></li>
    </ul>
  </nav>

  <div class="notice" id="notice" role="status" aria-live="polite"></div>
</aside>

<div class="main">
  <header class="topbar">
    <div class="user">
      <div class="avatar" aria-hidden="true">MM</div>
      <div>
        <div class="user-name">Maria Monitor</div>
        <div class="user-role">Monitoria EaD</div>
      </div>
    </div>
  </header>

  <main class="content" id="conteudo" aria-label="Área de conteúdo dos módulos"></main>
</div>

<script>
  (function () {
    var notice = document.getElementById('notice');
    var timer;
    document.querySelectorAll('button[data-modulo]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        notice.textContent = 'O módulo ' + btn.dataset.modulo + ' não está disponível neste protótipo.';
        notice.classList.add('show');
        clearTimeout(timer);
        timer = setTimeout(function () { notice.classList.remove('show'); }, 3500);
      });
    });
  })();
</script>
</body>
</html>
